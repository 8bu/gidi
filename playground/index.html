<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#f8f5f1"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#181512"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Gidi Finance playground</title>
    <script>
      // Apply the stored or system theme before first paint (ThemeProvider takes over afterwards).
      ;(function () {
        var stored = null
        try {
          stored = localStorage.getItem("theme")
        } catch (error) {}
        var dark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.add(dark ? "dark" : "light")
        // An explicit in-app choice overrides the OS-driven theme-color metas.
        if (stored === "dark" || stored === "light") {
          var metas = document.querySelectorAll('meta[name="theme-color"]')
          for (var i = 0; i < metas.length; i++) {
            metas[i].setAttribute("content", dark ? "#181512" : "#f8f5f1")
          }
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
